<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HG.MUSIC</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {

    min-height: 100vh;

    font-family: Arial, sans-serif;

    color: white;

    background:
        linear-gradient(
            135deg,
            #050505,
            #111111,
            #050505
        );

}


/* ================================
   PANTALLA DE INICIO
================================ */

#inicio {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    background:
        radial-gradient(
            circle,
            #151515,
            #050505 70%
        );

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    z-index: 9999;

    transition:
        opacity 1s ease,
        visibility 1s ease;

}


.logo-text {

    font-size: 58px;

    font-weight: 900;

    letter-spacing: 5px;

    background:
        linear-gradient(
            90deg,
            #1ed760,
            #00ffff,
            #7b2cff,
            #ff00ff,
            #1ed760
        );

    background-size: 300%;

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;

    animation:
        logoEntrada 1.2s ease,
        logoColores 4s linear infinite;

}


@keyframes logoEntrada {

    from {
        opacity: 0;
        transform: scale(0.5);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}


@keyframes logoColores {

    0% {
        background-position: 0%;
    }

    50% {
        background-position: 100%;
    }

    100% {
        background-position: 0%;
    }

}


.cargando {

    width: 55px;

    height: 55px;

    margin-top: 35px;

    border-radius: 50%;

    border:
        5px solid
        rgba(255,255,255,0.15);

    border-top:
        5px solid #1ed760;

    border-right:
        5px solid #00ffff;

    animation:
        cargar 1s linear infinite;

}


@keyframes cargar {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


.texto-inicio {

    margin-top: 20px;

    font-size: 13px;

    letter-spacing: 4px;

    color: #999;

}


#inicio.oculto {

    opacity: 0;

    visibility: hidden;

}


/* ================================
   FONDO
================================ */

body::before {

    content: "";

    position: fixed;

    width: 450px;

    height: 450px;

    background: #1ed760;

    filter: blur(180px);

    opacity: 0.10;

    top: -180px;

    left: -150px;

    z-index: -1;

}


body::after {

    content: "";

    position: fixed;

    width: 450px;

    height: 450px;

    background: #7b2cff;

    filter: blur(180px);

    opacity: 0.10;

    bottom: -180px;

    right: -150px;

    z-index: -1;

}


/* ================================
   TÍTULO
================================ */

header {

    text-align: center;

    padding: 25px;

}


header h1 {

    margin: 0;

    font-size: 38px;

    background:
        linear-gradient(
            90deg,
            #1ed760,
            #00ffff,
            #7b2cff,
            #ff00ff
        );

    background-size: 300%;

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;

    animation:
        colores 4s linear infinite;

}


/* ================================
   REPRODUCTOR
================================ */

.musica {

    width: 90%;

    max-width: 430px;

    margin: 20px auto;

    padding: 25px;

    background:
        rgba(255,255,255,0.07);

    border:
        1px solid
        rgba(255,255,255,0.1);

    border-radius: 25px;

    backdrop-filter: blur(20px);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,0.5);

    text-align: center;

}


/* ================================
   PORTADA
================================ */

.portada {

    width: 260px;

    height: 260px;

    margin: auto;

    border-radius: 20px;

    overflow: hidden;

    background: #222;

    box-shadow:
        0 10px 40px
        rgba(30,215,96,0.25);

}


.portada img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;

}


/* ================================
   NOMBRE
================================ */

.titulo {

    margin-top: 25px;

    font-size: 27px;

    font-weight: bold;

}


.artista {

    color: #aaa;

    margin-top: 8px;

    font-size: 14px;

}


/* ================================
   BARRA
================================ */

.barra {

    width: 100%;

    height: 8px;

    margin-top: 25px;

    background: #333;

    border-radius: 20px;

    overflow: hidden;

    cursor: pointer;

}


.progreso {

    width: 0%;

    height: 100%;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #1ed760,
            #00ffff,
            #7b2cff,
            #ff00ff
        );

}


/* ================================
   TIEMPO
================================ */

.tiempo {

    display: flex;

    justify-content: space-between;

    margin-top: 7px;

    color: #999;

    font-size: 12px;

}


/* ================================
   CONTROLES
================================ */

.controles {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 25px;

    margin-top: 25px;

}


.boton {

    width: 55px;

    height: 55px;

    border: none;

    border-radius: 50%;

    background: #292929;

    color: white;

    font-size: 20px;

    cursor: pointer;

}


.play {

    width: 75px;

    height: 75px;

    border: none;

    border-radius: 50%;

    color: black;

    font-size: 30px;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #1ed760,
            #00ffff,
            #8a2be2
        );

    box-shadow:
        0 0 25px
        rgba(30,215,96,0.5);

}


/* ================================
   DESCARGAR
================================ */

.descargar {

    width: 100%;

    margin-top: 25px;

    padding: 14px;

    border: none;

    border-radius: 14px;

    background:
        rgba(255,255,255,0.08);

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    text-decoration: none;

    display: none;

}


.descargar.visible {

    display: block;

}


/* ================================
   BOTÓN AGREGAR
================================ */

.agregar {

    width: 90%;

    max-width: 500px;

    margin: 25px auto 10px;

    padding: 16px;

    display: block;

    border: none;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            #1ed760,
            #00ffff
        );

    color: #000;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

}


.agregar:hover {

    transform: scale(1.02);

}


/* ================================
   FORMULARIO
================================ */

.formulario {

    width: 90%;

    max-width: 500px;

    margin: 15px auto;

    padding: 20px;

    background:
        rgba(255,255,255,0.07);

    border-radius: 20px;

    display: none;

}


.formulario.visible {

    display: block;

}


.formulario input {

    width: 100%;

    padding: 13px;

    margin-bottom: 12px;

    border: none;

    border-radius: 10px;

    background: #222;

    color: white;

    font-size: 15px;

}


.formulario label {

    display: block;

    margin-bottom: 7px;

    color: #bbb;

    font-size: 13px;

}


.boton-formulario {

    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 10px;

    background: #1ed760;

    color: black;

    font-weight: bold;

    cursor: pointer;

}


/* ================================
   LISTA
================================ */

.lista {

    width: 90%;

    max-width: 500px;

    margin:
        30px auto 60px;

}


.lista h2 {

    margin-bottom: 15px;

}


.cancion {

    display: flex;

    align-items: center;

    gap: 15px;

    padding: 12px;

    margin-bottom: 10px;

    background:
        rgba(255,255,255,0.06);

    border-radius: 15px;

    cursor: grab;

    transition:
        background 0.2s,
        transform 0.2s,
        opacity 0.2s;

    user-select: none;

    touch-action: none;

}


.cancion:active {

    cursor: grabbing;

}


.cancion.arrastrando {

    opacity: 0.45;

    transform: scale(0.98);

}


.cancion.destino {

    border:
        2px solid #1ed760;

}


.cancion:hover {

    background:
        rgba(30,215,96,0.15);

}


.mini-portada {

    width: 55px;

    height: 55px;

    border-radius: 10px;

    overflow: hidden;

    flex-shrink: 0;

}


.mini-portada img {

    width: 100%;

    height: 100%;

    object-fit: cover;

}


.info {

    flex: 1;

    text-align: left;

}


.nombre {

    font-weight: bold;

}


.artista-lista {

    color: #999;

    font-size: 13px;

    margin-top: 5px;

}


.arrastre {

    color: #777;

    font-size: 20px;

    padding: 5px;

}


.eliminar {

    border: none;

    background: transparent;

    color: #888;

    font-size: 18px;

    cursor: pointer;

}


/* ================================
   CELULAR
================================ */

@media (max-width: 500px) {

    .logo-text {
        font-size: 42px;
    }

    header h1 {
        font-size: 30px;
    }

    .portada {
        width: 230px;
        height: 230px;
    }

    .musica {
        padding: 20px;
    }

}

</style>

</head>


<body>


<!-- ================================
     PANTALLA DE INICIO
================================ -->

<div id="inicio">

    <div class="logo-text">
        HG.MUSIC
    </div>

    <div class="cargando"></div>

    <div class="texto-inicio">
        CARGANDO MÚSICA...
    </div>

</div>


<header>

    <h1>
        🎵 HG.MUSIC
    </h1>

</header>


<!-- ================================
     REPRODUCTOR
================================ -->

<div class="musica">

    <div class="portada">

        <img
            id="portada"
            src=""
            alt="Portada">

    </div>


    <div
        class="titulo"
        id="titulo">

        Selecciona una canción

    </div>


    <div
        class="artista"
        id="artista">

        Mi artista

    </div>


    <audio
        id="audio"
        preload="metadata">

        <source
            id="archivo"
            src=""
            type="audio/mpeg">

    </audio>


    <div
        class="barra"
        id="barra">

        <div
            class="progreso"
            id="progreso">
        </div>

    </div>


    <div class="tiempo">

        <span id="actual">
            0:00
        </span>

        <span id="duracion">
            0:00
        </span>

    </div>


    <div class="controles">

        <button
            class="boton"
            onclick="anterior()">

            ⏮

        </button>


        <button
            class="play"
            id="play"
            onclick="reproducir()">

            ▶

        </button>


        <button
            class="boton"
            onclick="siguiente()">

            ⏭

        </button>

    </div>


    <!-- DESCARGA -->

    <a
        id="descargar"
        class="descargar"
        download>

        ⬇️ Descargar canción

    </a>

</div>


<!-- ================================
     AGREGAR CANCIÓN
================================ -->

<button
    class="agregar"
    id="botonAgregar"
    onclick="mostrarFormulario()">

    ➕ Agregar canción

</button>


<div
    class="formulario"
    id="formulario">

    <label>
        Nombre de la canción
    </label>

    <input
        type="text"
        id="nombreNueva"
        placeholder="Ejemplo: Dos Problema">


    <label>
        Artista
    </label>

    <input
        type="text"
        id="artistaNueva"
        placeholder="Ejemplo: Mi artista">


    <label>
        Seleccionar canción MP3
    </label>

    <input
        type="file"
        id="archivoNuevo"
        accept="audio/*">


    <label>
        Seleccionar portada
    </label>

    <input
        type="file"
        id="portadaNueva"
        accept="image/*">


    <button
        class="boton-formulario"
        onclick="agregarCancion()">

        ✅ Agregar a HG.MUSIC

    </button>

</div>


<!-- ================================
     LISTA
================================ -->

<div
    class="lista"
    id="lista">

    <h2>
        🎶 Tus canciones
    </h2>

</div>


<script>


/* =================================================
   DETECTAR GITHUB
================================================= */

const esGitHub =
    window.location.hostname.includes("github.io") ||
    window.location.hostname.includes("github.com");


const esAdministrador =
    !esGitHub;


/* =================================================
   OCULTAR ADMINISTRACIÓN EN GITHUB
================================================= */

if (!esAdministrador) {

    document
        .getElementById("botonAgregar")
        .style.display = "none";

}


/* =================================================
   PANTALLA DE INICIO
================================================= */

setTimeout(function() {

    document
        .getElementById("inicio")
        .classList.add("oculto");

}, 2500);


/* =================================================
   ELEMENTOS
================================================= */

const audio =
    document.getElementById("audio");

const archivo =
    document.getElementById("archivo");

const portada =
    document.getElementById("portada");

const play =
    document.getElementById("play");

const progreso =
    document.getElementById("progreso");

const barra =
    document.getElementById("barra");

const actual =
    document.getElementById("actual");

const duracion =
    document.getElementById("duracion");

const titulo =
    document.getElementById("titulo");

const artista =
    document.getElementById("artista");

const lista =
    document.getElementById("lista");

const descargar =
    document.getElementById("descargar");


/* =================================================
   CANCIONES
================================================= */

/*
   IMPORTANTE:

   La lista está VACÍA intencionalmente.

   Se eliminaron todas las canciones anteriores
   que estaban causando problemas.

   Cuando agregues nuevas canciones desde VS Code,
   aparecerán aquí temporalmente.
*/

let canciones = [];


let indice = -1;


/* =================================================
   ARCHIVOS TEMPORALES
================================================= */

let archivosTemporales = [];


/* =================================================
   MOSTRAR LISTA
================================================= */

function mostrarLista() {

    lista.innerHTML = `
        <h2>🎶 Tus canciones</h2>
    `;


    if (canciones.length === 0) {

        lista.innerHTML += `

            <div
                style="
                    text-align:center;
                    color:#777;
                    padding:30px 10px;
                ">

                No hay canciones todavía.

                <br>

                ${
                    esAdministrador
                    ?
                    "Pulsa «Agregar canción» para comenzar."
                    :
                    "Pronto habrá canciones disponibles."
                }

            </div>

        `;

        return;

    }


    canciones.forEach(
        function(cancion, numero) {

            const elemento =
                document.createElement("div");


            elemento.className =
                "cancion";


            elemento.dataset.index =
                numero;


            elemento.innerHTML = `

                <div class="mini-portada">

                    <img
                        src="${cancion.portada}"
                        alt="${cancion.nombre}">

                </div>


                <div class="info">

                    <div class="nombre">
                        ${cancion.nombre}
                    </div>

                    <div class="artista-lista">
                        ${cancion.artista}
                    </div>

                </div>


                <div class="play-lista">
                    ▶
                </div>


                <div class="arrastre">
                    ☷
                </div>


                ${
                    esAdministrador
                    ?
                    `
                    <button
                        class="eliminar"
                        onclick="
                            event.stopPropagation();
                            eliminarCancion(${numero})
                        ">

                        🗑️

                    </button>
                    `
                    :
                    ""
                }

            `;


            elemento.addEventListener(
                "click",
                function() {

                    cambiarCancion(
                        Number(
                            elemento.dataset.index
                        )
                    );

                }
            );


            configurarArrastre(
                elemento
            );


            lista.appendChild(
                elemento
            );

        }
    );

}


/* =================================================
   INICIAR LISTA VACÍA
================================================= */

mostrarLista();


/* =================================================
   MOSTRAR FORMULARIO
================================================= */

function mostrarFormulario() {

    if (!esAdministrador) {
        return;
    }


    document
        .getElementById("formulario")
        .classList.toggle("visible");

}


/* =================================================
   AGREGAR CANCIÓN
================================================= */

function agregarCancion() {

    if (!esAdministrador) {
        return;
    }


    const nombre =
        document
        .getElementById("nombreNueva")
        .value
        .trim();


    const artistaNombre =
        document
        .getElementById("artistaNueva")
        .value
        .trim();


    const archivoMusica =
        document
        .getElementById("archivoNuevo")
        .files[0];


    const archivoPortada =
        document
        .getElementById("portadaNueva")
        .files[0];


    if (
        !nombre ||
        !archivoMusica ||
        !archivoPortada
    ) {

        alert(
            "Completa el nombre y selecciona la canción y la portada."
        );

        return;

    }


    const urlMusica =
        URL.createObjectURL(
            archivoMusica
        );


    const urlPortada =
        URL.createObjectURL(
            archivoPortada
        );


    const nuevaCancion = {

        archivo:
            urlMusica,

        portada:
            urlPortada,

        nombre:
            nombre,

        artista:
            artistaNombre ||
            "Mi artista"

    };


    canciones.push(
        nuevaCancion
    );


    archivosTemporales.push({

        musica:
            archivoMusica,

        portada:
            archivoPortada

    });


    mostrarLista();


    document.getElementById(
        "nombreNueva"
    ).value = "";


    document.getElementById(
        "artistaNueva"
    ).value = "";


    document.getElementById(
        "archivoNuevo"
    ).value = "";


    document.getElementById(
        "portadaNueva"
    ).value = "";


    document
        .getElementById("formulario")
        .classList.remove("visible");


    cambiarCancion(
        canciones.length - 1
    );

}


/* =================================================
   ELIMINAR CANCIÓN
================================================= */

function eliminarCancion(numero) {

    if (!esAdministrador) {
        return;
    }


    const confirmar =
        confirm(
            "¿Quieres eliminar esta canción de la lista?"
        );


    if (!confirmar) {
        return;
    }


    if (
        canciones[numero] &&
        canciones[numero].archivo &&
        canciones[numero].archivo.startsWith("blob:")
    ) {

        URL.revokeObjectURL(
            canciones[numero].archivo
        );

        URL.revokeObjectURL(
            canciones[numero].portada
        );

    }


    canciones.splice(
        numero,
        1
    );


    if (
        indice === numero
    ) {

        audio.pause();

        audio.removeAttribute("src");

        audio.load();

        portada.removeAttribute("src");

        titulo.innerHTML =
            "Selecciona una canción";

        artista.innerHTML =
            "Mi artista";

        play.innerHTML =
            "▶";

        descargar.classList.remove(
            "visible"
        );

        indice = -1;

    }

    else if (
        indice > numero
    ) {

        indice--;

    }


    mostrarLista();

}


/* =================================================
   REPRODUCIR
================================================= */

function reproducir() {

    if (
        indice === -1 ||
        !audio.src
    ) {

        return;

    }


    if (audio.paused) {

        audio.play()
        .then(
            function() {

                play.innerHTML =
                    "⏸";

            }
        )
        .catch(
            function(error) {

                console.error(
                    error
                );

            }
        );

    }

    else {

        audio.pause();

        play.innerHTML =
            "▶";

    }

}


/* =================================================
   CAMBIAR CANCIÓN
================================================= */

function cambiarCancion(numero) {

    if (
        numero < 0 ||
        numero >= canciones.length
    ) {

        return;

    }


    indice = numero;


    audio.pause();


    audio.src =
        canciones[indice].archivo;


    portada.src =
        canciones[indice].portada;


    titulo.innerHTML =
        canciones[indice].nombre;


    artista.innerHTML =
        canciones[indice].artista;


    descargar.href =
        canciones[indice].archivo;


    descargar.download =
        canciones[indice].nombre + ".mp3";


    descargar.classList.add(
        "visible"
    );


    progreso.style.width =
        "0%";


    actual.innerHTML =
        "0:00";


    duracion.innerHTML =
        "0:00";


    audio.load();


    /*
       NO intentamos reproducir automáticamente.

       Esto evita errores y ventanas emergentes
       cuando todavía no se ha hecho una acción
       del usuario.
    */

    play.innerHTML =
        "▶";

}


/* =================================================
   SIGUIENTE
================================================= */

function siguiente() {

    if (
        canciones.length === 0
    ) {

        return;

    }


    indice++;


    if (
        indice >= canciones.length
    ) {

        indice = 0;

    }


    cambiarCancion(
        indice
    );

}


/* =================================================
   ANTERIOR
================================================= */

function anterior() {

    if (
        canciones.length === 0
    ) {

        return;

    }


    indice--;


    if (
        indice < 0
    ) {

        indice =
            canciones.length - 1;

    }


    cambiarCancion(
        indice
    );

}


/* =================================================
   PROGRESO
================================================= */

audio.addEventListener(
    "timeupdate",
    function() {

        if (!audio.duration) {
            return;
        }


        const porcentaje =
            (
                audio.currentTime /
                audio.duration
            ) * 100;


        progreso.style.width =
            porcentaje + "%";


        actual.innerHTML =
            convertirTiempo(
                audio.currentTime
            );

    }
);


/* =================================================
   DURACIÓN
================================================= */

audio.addEventListener(
    "loadedmetadata",
    function() {

        duracion.innerHTML =
            convertirTiempo(
                audio.duration
            );

    }
);


/* =================================================
   CUANDO TERMINA
================================================= */

audio.addEventListener(
    "ended",
    function() {

        siguiente();

    }
);


/* =================================================
   PAUSA MANUAL
================================================= */

audio.addEventListener(
    "pause",
    function() {

        play.innerHTML =
            "▶";

    }
);


/* =================================================
   REPRODUCCIÓN
================================================= */

audio.addEventListener(
    "play",
    function() {

        play.innerHTML =
            "⏸";

    }
);


/* =================================================
   BARRA
================================================= */

barra.addEventListener(
    "click",
    function(e) {

        if (!audio.duration) {
            return;
        }


        const rect =
            barra.getBoundingClientRect();


        const posicion =
            e.clientX -
            rect.left;


        const porcentaje =
            posicion /
            rect.width;


        audio.currentTime =
            porcentaje *
            audio.duration;

    }
);


/* =================================================
   CONVERTIR TIEMPO
================================================= */

function convertirTiempo(
    segundos
) {

    if (
        !isFinite(segundos)
    ) {

        return "0:00";

    }


    const minutos =
        Math.floor(
            segundos / 60
        );


    const segundosRestantes =
        Math.floor(
            segundos % 60
        );


    return (
        minutos +
        ":" +
        (
            segundosRestantes < 10
            ?
            "0" +
            segundosRestantes
            :
            segundosRestantes
        )
    );

}


/* =================================================
   ARRASTRAR CANCIONES
================================================= */

function configurarArrastre(
    elemento
) {

    let inicioY = 0;

    let moviendo = false;

    let destino = null;


    elemento.addEventListener(
        "pointerdown",
        function(e) {

            inicioY =
                e.clientY;

            moviendo =
                true;


            elemento.classList.add(
                "arrastrando"
            );


            elemento.setPointerCapture(
                e.pointerId
            );

        }
    );


    elemento.addEventListener(
        "pointermove",
        function(e) {

            if (!moviendo) {
                return;
            }


            const movimiento =
                e.clientY -
                inicioY;


            const elementos =
                Array.from(
                    lista.querySelectorAll(
                        ".cancion"
                    )
                );


            elementos.forEach(
                function(otro) {

                    otro.classList.remove(
                        "destino"
                    );

                }
            );


            const actualIndex =
                elementos.indexOf(
                    elemento
                );


            destino = null;


            if (
                movimiento > 20
            ) {

                const siguienteElemento =
                    elementos[
                        actualIndex + 1
                    ];


                if (siguienteElemento) {

                    destino =
                        siguienteElemento;

                    destino.classList.add(
                        "destino"
                    );

                }

            }


            if (
                movimiento < -20
            ) {

                const anteriorElemento =
                    elementos[
                        actualIndex - 1
                    ];


                if (anteriorElemento) {

                    destino =
                        anteriorElemento;

                    destino.classList.add(
                        "destino"
                    );

                }

            }

        }
    );


    elemento.addEventListener(
        "pointerup",
        function() {

            if (!moviendo) {
                return;
            }


            moviendo = false;


            elemento.classList.remove(
                "arrastrando"
            );


            const elementos =
                Array.from(
                    lista.querySelectorAll(
                        ".cancion"
                    )
                );


            elementos.forEach(
                function(otro) {

                    otro.classList.remove(
                        "destino"
                    );

                }
            );


            if (destino) {

                const desde =
                    elementos.indexOf(
                        elemento
                    );


                const hasta =
                    elementos.indexOf(
                        destino
                    );


                if (
                    desde !== -1 &&
                    hasta !== -1 &&
                    desde !== hasta
                ) {

                    const cancionMovida =
                        canciones.splice(
                            desde,
                            1
                        )[0];


                    canciones.splice(
                        hasta,
                        0,
                        cancionMovida
                    );


                    indice =
                        canciones.indexOf(
                            cancionMovida
                        );


                    mostrarLista();

                }

            }


            destino = null;

        }
    );


    elemento.addEventListener(
        "pointercancel",
        function() {

            moviendo = false;

            elemento.classList.remove(
                "arrastrando"
            );

            destino = null;

        }
    );

}

</script>
